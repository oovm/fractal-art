# Deploy VMZ homepage static site to Cloudflare Pages.
#
# Secrets (repo → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with Account / Cloudflare Pages Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id
#
# Optional variable:
#   CLOUDFLARE_PAGES_PROJECT — defaults to fractal-art (must match wrangler.toml name)

name: Deploy homepage

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/deploy-homepage.yml"
      - "projects/packages/homepage/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-homepage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build homepage (VMZ static → dist/cdn)
        run: pnpm --filter homepage build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: projects/packages/homepage
          command: pages deploy dist/cdn --project-name=fractal-art
