[package]
name = "fractal-napi"
publish = false
version = "0.0.0"
authors = ["Aster <192607617@qq.com>"]
description = "Node-API bindings for @doki-land/fractal"
repository = "https://github.com/oovm/fractal-art"
license = "MPL-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
fractal = { path = "../fractal" }

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "fractal"
